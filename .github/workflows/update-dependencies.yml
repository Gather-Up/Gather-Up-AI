name: Update Dependencies

on:
  # Run weekly on Mondays at 9 AM UTC
  schedule:
    - cron: '0 9 * * 1'
  
  # Allow manual trigger
  workflow_dispatch:
  
  # Run when requirements files are pushed to main
  push:
    branches:
      - main
    paths:
      - 'services/**/requirements.txt'
      - 'services/**/requirements.in'
      - '.github/workflows/update-dependencies.yml'

permissions:
  contents: write
  pull-requests: write

jobs:
  update-dependencies:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      
      - name: Install pip-tools
        run: |
          python -m pip install --upgrade pip
          pip install pip-tools
      
      - name: Update dependencies for all services
        id: update
        run: |
          # Initialize flag to track if any changes were made
          CHANGES_MADE=false
          CHANGES_SUMMARY=""
          
          # Services to update
          SERVICES=("api-gateway" "location-service" "vendor-service")
          
          for SERVICE in "${SERVICES[@]}"; do
            echo "Processing $SERVICE..."
            SERVICE_DIR="services/$SERVICE"
            
            if [ -f "$SERVICE_DIR/requirements.txt" ]; then
              # Create requirements.in from requirements.txt if it doesn't exist or is empty
              if [ ! -s "$SERVICE_DIR/requirements.in" ]; then
                echo "Creating requirements.in for $SERVICE from requirements.txt..."
                # Extract base package names without versions for .in file
                grep -v '^#' "$SERVICE_DIR/requirements.txt" | grep -v '^$' | sed 's/==.*//' | sed 's/>=.*//' | sed 's/<.*//' > "$SERVICE_DIR/requirements.in"
              fi
              
              # Backup current requirements.txt
              cp "$SERVICE_DIR/requirements.txt" "$SERVICE_DIR/requirements.txt.backup"
              
              # Compile new requirements with latest versions
              cd "$SERVICE_DIR"
              pip-compile --upgrade --resolver=backtracking requirements.in
              cd ../..
              
              # Check if there are changes
              if ! diff -q "$SERVICE_DIR/requirements.txt" "$SERVICE_DIR/requirements.txt.backup" > /dev/null 2>&1; then
                CHANGES_MADE=true
                echo "✓ Updated dependencies for $SERVICE"
                
                # Generate summary of changes
                DIFF_OUTPUT=$(diff "$SERVICE_DIR/requirements.txt.backup" "$SERVICE_DIR/requirements.txt" | grep '^[<>]' | head -20)
                CHANGES_SUMMARY="$CHANGES_SUMMARY\n\n### $SERVICE\n\`\`\`diff\n$DIFF_OUTPUT\n\`\`\`"
              else
                echo "✓ No updates needed for $SERVICE"
              fi
              
              # Remove backup
              rm "$SERVICE_DIR/requirements.txt.backup"
            fi
          done
          
          # Set output for next steps
          echo "changes_made=$CHANGES_MADE" >> $GITHUB_OUTPUT
          
          # Save changes summary to file
          echo -e "$CHANGES_SUMMARY" > /tmp/changes_summary.txt
      
      - name: Create Pull Request
        if: steps.update.outputs.changes_made == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: update dependencies across all services'
          title: '🔄 Update Dependencies'
          body: |
            ## Automated Dependency Updates
            
            This PR updates outdated dependencies across all services to their latest compatible versions.
            
            ### Services Updated
            - API Gateway
            - Location Service
            - Vendor Service
            
            ### Changes
            $(cat /tmp/changes_summary.txt)
            
            ### Python Version
            - Python: 3.13
            
            ---
            *This PR was automatically generated by the update-dependencies workflow.*
            
            **⚠️ Please review the changes and ensure all tests pass before merging.**
          branch: automated-dependency-updates
          delete-branch: true
          labels: |
            dependencies
            automated
          draft: false
      
      - name: Check for PR creation
        if: steps.update.outputs.changes_made == 'true'
        run: |
          echo "✓ Pull request created successfully with all dependency updates!"
      
      - name: No updates needed
        if: steps.update.outputs.changes_made != 'true'
        run: |
          echo "✓ All dependencies are up to date!"
