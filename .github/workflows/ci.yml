name: CI

on:
  push:
    branches: [ main ]
    paths:
      - "services/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "services/**"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.service }} tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api-gateway
            dir: services/api-gateway
            install: pip install -r requirements.txt
          - service: location-service
            dir: services/location-service
            install: pip install -r requirements.txt
          - service: vendor-service
            dir: services/vendor-service
            install: pip install pytest

    defaults:
      run:
        working-directory: ${{ matrix.dir }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            services/api-gateway/requirements.txt
            services/location-service/requirements.txt
            services/vendor-service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          ${{ matrix.install }}

      - name: Run tests
        run: pytest -q
