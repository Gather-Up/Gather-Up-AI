name: Dependency health check

on:
  schedule:
    - cron: "0 3 * * 1"  # Mondays 03:00 UTC
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install packaging pip-audit

      - name: Outdated report (api-gateway)
        run: |
          python scripts/check_outdated.py services/api-gateway/requirements.txt

      - name: Outdated report (location-service)
        run: |
          python scripts/check_outdated.py services/location-service/requirements.txt

      - name: Outdated report (vendor-service)
        run: |
          # Only check top-level versions; skip heavy installs
          python scripts/check_outdated.py services/vendor-service/requirements.txt

      - name: Security audit (api-gateway)
        continue-on-error: true
        run: |
          pip-audit -r services/api-gateway/requirements.txt --progress-spinner=off

      - name: Security audit (location-service)
        continue-on-error: true
        run: |
          pip-audit -r services/location-service/requirements.txt --progress-spinner=off

      - name: Summarize
        run: echo "Dependency check completed. See logs above for outdated packages and audit results."
