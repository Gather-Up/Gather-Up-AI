version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/services/api-gateway"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "torch"   # avoid heavy auto updates via Dependabot
  - package-ecosystem: "pip"
    directory: "/services/location-service"
    schedule:
      interval: "weekly"
  - package-ecosystem: "pip"
    directory: "/services/vendor-service"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "torch"   # optional: avoid GPU wheels churn
      - dependency-name: "transformers"
      - dependency-name: "sentence-transformers"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
